name: ProyectoIA CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  pdf-unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/pdf-extractor

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Version
        run: python --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        run: pytest tests/unit --cov=app

  rag-unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/rag-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Version
        run: python --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        run: pytest tests/unit --cov=app

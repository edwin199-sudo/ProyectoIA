services:
  postgres:
    image: postgres:16

    container_name: proyectoia-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    networks:
      - proyectoia-network
      
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: proyectoia-n8n

    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}

      TZ: ${TZ}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}

      N8N_RESTRICT_FILE_ACCESS_TO: /data

    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data:/data

    depends_on:
      - postgres
    networks:
      - proyectoia-network  

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: proyectoia-open-webui
    restart: unless-stopped

    ports:
      - "3000:8080"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    volumes:
      - ./data/open-webui:/app/backend/data

    depends_on:
      - ollama
    networks:
      - proyectoia-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: proyectoia-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - proyectoia-network

  ollama:
    image: ollama/ollama:latest
    container_name: proyectoia-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - proyectoia-network

    tty: true
  pdf-extractor:
    build:
      context: ./services/pdf-extractor

    container_name: proyectoia-pdf-extractor

    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./services/pdf-extractor/app:/app/app
      - ./data:/data

    networks:
      - proyectoia-network

    depends_on:
      - ollama

  rag-service:
    build:
      context: ./services/rag-service

    container_name: proyectoia-rag-service

    restart: unless-stopped

    ports:
      - "8001:8000"

    volumes:
      - ./services/rag-service/app:/app/app

    depends_on:
      - ollama
      - qdrant

    networks:
      - proyectoia-network
      
networks:
  proyectoia-network:
    driver: bridge